# Unit tests only. The benchmark itself (run.sh, Docker image per PHP version) never runs in CI:
# it is slow, and timings on a shared CI host mean nothing.
# Network steps (apk, Composer installer, composer update) retry up to 3 times with a 5s pause,
# so a network blip does not fail the job; a real failure still fails after the last attempt.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:                       # newest PHP: every validator, incl. property hooks and Respect 3
    runs-on: docker
    container: php:8.5-cli-alpine
    steps:
      # nodejs for the checkout action
      - run: |
          for i in 1 2 3; do apk add --no-cache nodejs git unzip && exit 0; echo "attempt $i failed"; sleep 5; done; exit 1
      - uses: https://data.forgejo.org/actions/checkout@v4
      - run: |
          for i in 1 2 3; do curl -fsS -o /tmp/composer-setup.php https://getcomposer.org/installer && php /tmp/composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer && exit 0; echo "attempt $i failed"; sleep 5; done; exit 1
      - run: |
          for i in 1 2 3; do composer update --no-interaction --no-progress && exit 0; echo "attempt $i failed"; sleep 5; done; exit 1
      - run: vendor/bin/phpunit
  test-php82:                 # oldest supported PHP: Symfony 7.4, Respect 2, no property hooks
    runs-on: docker
    container: php:8.2-cli-alpine
    steps:
      # nodejs for the checkout action
      - run: |
          for i in 1 2 3; do apk add --no-cache nodejs git unzip && exit 0; echo "attempt $i failed"; sleep 5; done; exit 1
      - uses: https://data.forgejo.org/actions/checkout@v4
      - run: |
          for i in 1 2 3; do curl -fsS -o /tmp/composer-setup.php https://getcomposer.org/installer && php /tmp/composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer && exit 0; echo "attempt $i failed"; sleep 5; done; exit 1
      - run: |
          for i in 1 2 3; do composer update --no-interaction --no-progress && exit 0; echo "attempt $i failed"; sleep 5; done; exit 1
      - run: vendor/bin/phpunit
