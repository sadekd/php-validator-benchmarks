# Unit tests only. The benchmark itself (run.sh, Docker image per PHP version) never runs in CI:
# it is slow, and timings on a shared CI host mean nothing.
# Network steps (apk, git fetch, Composer installer, composer update) retry up to 3 times with a 5s pause,
# and the Composer installer is verified against its published SHA-384 (.forgejo/scripts/install-composer.sh),
# so a network blip does not fail the job; a real failure still fails after the last attempt.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:                       # newest PHP: every validator, incl. property hooks and Respect 3
    runs-on: docker
    container: php:8.5-cli-alpine
    steps:
      - run: |
          for i in 1 2 3; do apk add --no-cache git unzip && exit 0; echo "attempt $i failed"; sleep 5; done; exit 1
      # plain git fetch of the exact commit under test (no checkout action, so no nodejs)
      - run: |
          for i in 1 2 3; do
            rm -rf .git
            git init -q . \
              && git remote add origin "$(echo "$SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$REPO.git" \
              && git fetch -q --depth 1 origin "$SHA" \
              && git checkout -q FETCH_HEAD && exit 0
            echo "attempt $i failed"; sleep 5
          done; exit 1
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
      - run: sh .forgejo/scripts/install-composer.sh
      - run: |
          for i in 1 2 3; do composer update --no-interaction --no-progress && exit 0; echo "attempt $i failed"; sleep 5; done; exit 1
      - run: vendor/bin/phpunit
  test-php82:                 # oldest supported PHP: Symfony 7.4, Respect 2, no property hooks
    runs-on: docker
    container: php:8.2-cli-alpine
    steps:
      - run: |
          for i in 1 2 3; do apk add --no-cache git unzip && exit 0; echo "attempt $i failed"; sleep 5; done; exit 1
      # plain git fetch of the exact commit under test (no checkout action, so no nodejs)
      - run: |
          for i in 1 2 3; do
            rm -rf .git
            git init -q . \
              && git remote add origin "$(echo "$SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$REPO.git" \
              && git fetch -q --depth 1 origin "$SHA" \
              && git checkout -q FETCH_HEAD && exit 0
            echo "attempt $i failed"; sleep 5
          done; exit 1
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
      - run: sh .forgejo/scripts/install-composer.sh
      - run: |
          for i in 1 2 3; do composer update --no-interaction --no-progress && exit 0; echo "attempt $i failed"; sleep 5; done; exit 1
      - run: vendor/bin/phpunit
